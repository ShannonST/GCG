<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1016">
<title>GTCG My Card Collection</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0E1016;--panel:#171A23;--panel2:#12141B;--line:#2A2F3D;--text:#ECEEF4;--muted:#A3AABB;--accent:#A678F0;--ok:#5FD39A;--warn:#F2A65A;--bad:#F07A7A;
--purple:#A678F0;--blue:#4F8FF7;--white:#CFD4DE;--red:#F06A6A;--green:#5CC97A;--none:#5A6078}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:18px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.wrap{padding:12px 16px;max-width:760px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{min-height:44px;border-radius:12px;border:0;background:var(--accent);color:#0E1016;font-weight:700;padding:0 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.chip{flex:none;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer}
.chip.on{background:var(--text);color:#0E1016;border-color:var(--text);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;border:0;border-radius:9px;background:none;cursor:pointer}
.seg button.on{background:var(--text);color:#0E1016;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
@media(max-width:360px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:560px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.tile .img{position:relative;aspect-ratio:63/88;border-radius:6px;overflow:visible;background:var(--none);border:2px solid transparent}
.tile .img img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0E1016;text-align:center;padding:4px;border-radius:4px}
.tile .qty{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#0E1016;border:2px solid var(--text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile .need{position:absolute;left:3px;right:3px;bottom:3px;text-align:center;font-size:10px;font-weight:700;background:var(--warn);color:#0E1016;border-radius:4px}
.tile .plus{position:absolute;left:3px;top:3px;font-size:9px;font-weight:800;background:#FDE68A;color:#0E1016;border-radius:4px;padding:0 3px}
.tile.missing .img{border-color:var(--warn);opacity:.75}
.tile .slv{position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:800;background:#0E1016cc;color:#fff;border:1px solid #fff8;border-radius:4px;padding:0 3px}
.tile.sel .img{outline:3px solid var(--accent);outline-offset:2px}
.tile .tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;background:#A678F055;border-radius:4px}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 24px #0008}
.tile .nm{font-size:11px;font-weight:600;line-height:1.25;max-height:28px;overflow:hidden}
.tile .no{font-size:10px;color:var(--muted)}
.list .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:#2E6B4F}.pill.warn{color:var(--warn);border-color:#7A5326}.pill.bad{color:var(--bad);border-color:#7A3333}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-height:48px;justify-content:center;cursor:pointer}
nav.tabs button.on{color:#C9B5FF}
nav.tabs .scanbtn{color:#0E1016}
nav.tabs .scanbtn span.c{width:48px;height:48px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 14px #0008}
.sheet-bg{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#0E1016;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;display:none;max-width:90vw;text-align:center}
.cam{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
.cam.on{display:flex}
.live .box{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:62vw;max-width:360px;height:15vw;max-height:86px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px #0008;transition:border-color .15s}
.live .box.hit{border-color:#5BE38A}
.live .read{position:absolute;left:0;right:0;top:calc(38% + 11vw + 14px);text-align:center;color:#fff;font:600 15px/1.3 system-ui;text-shadow:0 1px 3px #000;padding:0 16px}
.live .panel{position:absolute;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));background:#15171f;border:1px solid #2a2d38;border-radius:16px;padding:12px;display:none;color:#fff}
.live .panel.on{display:block}
.live .qty{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.live .qty button{padding:14px 0;font-size:20px;font-weight:700}
.live .count{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));background:#A678F0;color:#111;border-radius:999px;padding:6px 12px;font-weight:700}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:76vw;max-width:420px;aspect-ratio:63/88;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px #0009}
.cam .hint{position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.cam .bar{position:absolute;bottom:0;left:0;right:0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#ffffff33;cursor:pointer}
.editor{position:relative;touch-action:none;margin:8px auto;max-width:100%}
.editor canvas{display:block;max-width:100%;border-radius:8px}
.handle{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#A678F0cc;border:3px solid #fff;touch-action:none}
.prog{height:6px;border-radius:99px;background:#22262F;overflow:hidden}
.prog>div{height:100%;background:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.hidden{display:none!important}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:#22262F;font-size:20px;cursor:pointer}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.checkrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.checkrow input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
</style>
</head>
<body>

<div id="app"></div>

<nav class="tabs" id="tabs">
  <button data-tab="collection" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/></svg>Collection</button>
  <button data-tab="building"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h2l2 11h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>Building</button>
  <button data-tab="scan" class="scanbtn" aria-label="Scan a card"><span class="c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg></span></button>
  <button data-tab="build"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/></svg>Build</button>
  <button data-tab="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<div class="cam live" id="live">
  <video id="lvVideo" playsinline muted autoplay></video>
  <div class="hint" style="text-align:left;padding:0 120px 0 16px">Hold the card a hand-span away and zoom so the number fills the box</div>
  <div class="count" id="lvCount">0 cards</div>
  <div class="box" id="lvBox"></div>
  <div class="read" id="lvRead">Starting camera…</div>
  <div class="row" id="lvCtl" style="position:absolute;left:0;right:0;top:calc(38% + 11vw + 46px);justify-content:center;gap:8px">
    <button class="btn ghost sm" id="lvCamBtn" style="background:#0008;color:#fff;border-color:#fff6">Camera 1</button>
    <button class="btn ghost sm" id="lvZoomBtn" style="background:#0008;color:#fff;border-color:#fff6">Zoom 2×</button>
    <button class="btn ghost sm" id="lvLightBtn" style="background:#0008;color:#fff;border-color:#fff6">Light off</button>
  </div>
  <div class="panel" id="lvPanel"></div>
  <div class="bar">
    <button class="btn ghost" id="lvClose" style="background:#0008;color:#fff;border-color:#fff6">Cancel</button>
    <button class="btn" id="lvDone">Done — review</button>
  </div>
</div>
<div class="cam" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="hint" id="camHint">Card flat on a table · fill the frame · no glare on the number</div>
  <div class="bar">
    <button class="btn ghost" id="camClose" style="background:#0008;color:#fff;border-color:#fff6">Cancel</button>
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
    <label class="btn ghost" style="background:#0008;color:#fff;border-color:#fff6;display:inline-flex;align-items:center">Photo<input type="file" accept="image/*" id="camPick" hidden></label><input type="file" accept="image/*" capture="environment" id="camShoot" hidden>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   GTCG My Card Collection — standalone phone app
   Everything is stored on this phone (IndexedDB). No account needed.
   ===================================================================== */

// ---------- Rules (update here when Bandai changes the ban list) ----------
const RULES = {
  listDate: 'July 2026 (with later 2/2 additions)',
  banned: { 'GD01-020': 'Anksha' },
  restricted: { 'ST02-016': 2 },                                  // Corsica Base max 2
  bannedPairs: [['ST01-010', 'ST05-010'], ['GD01-008', 'GD05-015']], // Amuro + Mikazuki, Guntank + M1 Astray Shrike
};
const COLOURS = ['purple', 'blue', 'white', 'red', 'green'];
const TYPES = ['Unit', 'Pilot', 'Command', 'Base', 'Resource', 'EX Resource', 'EX Base'];
const RESOURCE_TYPES = new Set(['Resource', 'EX Resource', 'EX Base']); // these live in the separate resource deck, not the 50 cards
const isResource = num => RESOURCE_TYPES.has(info(num).type);
const RAR_SCORE = { LR: 3.2, R: 2.6, U: 2.2, C: 1.8 }; // rarity is only a rough guide to strength — fitting the deck matters more

// ---------- Card list ----------
// catalog.json holds every card's facts (number, name, colour, type, level, cost, AP/HP, rarity,
// link pilot, TCGplayer market price in US$). Built from tcgcsv.com. Card effect text is not included.
let SEED = [];
async function loadSeed() {
  try { const r = await fetch('catalog.json'); SEED = (await r.json()).map(c => ({ link: '', ...c, vanilla: !!c.vanilla || (c.type === 'Unit' && c.lv === 2 && c.cost === 1 && c.ap === 2 && c.hp === 2 && 'text' in c && !/[a-z]/i.test(c.text)) })); /* plain 2/2s, incl. ones the list does not flag (Daughseat) */ }
  catch { SEED = []; toast('Card list not loaded — check your connection', 3500); }
}

// ---------- Tiny helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const money = n => cash(n, 'AUD'); // eBay AU prices
const colourVar = c => `var(--${COLOURS.includes(c) ? c : 'none'})`;
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function normNum(raw) {
  if (!raw) return '';
  let s = String(raw).toUpperCase().replace(/\s+/g, '').replace(/[–—_]/g, '-');
  let m = s.match(/^(GD|ST|EB|PR)O?(\d{1,2})-?(\d{3})$/) || s.match(/^(GD|ST|EB|PR)(\d{2})-(\d{3})/);
  if (m) return `${m[1]}${m[2].padStart(2, '0')}-${m[3]}`;
  m = s.match(/^(R|T|EXRP)-?(\d{3})$/); if (m) return `${m[1]}-${m[2]}`;
  return s;
}

// ---------- Currency: prices shown in your chosen currency ----------
// Card-list prices are TCGplayer (US$); eBay prices are AU$. Converted with a daily exchange rate (open.er-api.com, saved for offline).
const CURRENCIES = [['AUD', 'Australian dollar'], ['USD', 'US dollar'], ['NZD', 'NZ dollar'], ['GBP', 'British pound'], ['EUR', 'Euro'], ['CAD', 'Canadian dollar'], ['JPY', 'Japanese yen']];
const CUR = () => S.settings.currency || 'AUD';
async function loadFx(force) {
  const f = S.fx; if (!force && f && f.rates && daysSince(f.date) < 1) return;
  try { const j = await (await fetch('https://open.er-api.com/v6/latest/USD')).json(); if (j.rates) { S.fx = { date: today(), rates: j.rates }; save(); } } catch { }
}
function conv(n, from = 'USD', to = CUR()) { // null if no rate yet
  if (n == null || isNaN(n)) return null; if (from === to) return +n;
  const r = S.fx && S.fx.rates; if (!r || !r[from] || !r[to]) return null; return n / r[from] * r[to];
}
function cash(n, from = 'USD') {
  if (n == null || isNaN(n)) return '';
  let v = conv(n, from), c = CUR(); if (v == null) { v = +n; c = from; } // no rate yet: show the original currency
  try { return new Intl.NumberFormat('en-AU', { style: 'currency', currency: c, maximumFractionDigits: c === 'JPY' ? 0 : 2 }).format(v); } catch { return c + ' ' + v.toFixed(2); }
}
const usd = n => cash(n, 'USD');                 // TCGplayer prices
const toUSD = n => conv(n, CUR(), 'USD') ?? +n;  // a budget typed in your currency → US$ for the card list
// ---------- Storage (IndexedDB) ----------
const DB = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('gtcg', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); }; r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  keys(store) { return this.tx(store, 'readonly', s => s.getAllKeys()); },
  clear(store) { return this.tx(store, 'readwrite', s => s.clear()); },
};
const BLANK = () => ({ v: 1, cards: {}, learned: {}, cores: {}, decks: {}, settings: { officialImages: true, quality: 'low', includeIncoming: true, keepPhotos: false } });
let S = BLANK();
let saveTimer;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => DB.put('kv', 'state', S).catch(() => toast('Could not save — storage may be full')), 150); }

// card list lookup: learned cards override starter list
let CATALOG = {};
function rebuildCatalog() { CATALOG = {}; SEED.forEach(c => CATALOG[c.num] = c); Object.values(S.learned).forEach(c => CATALOG[c.num] = { ...(CATALOG[c.num] || {}), ...c }); }
const info = num => CATALOG[num] || { num, name: num, colour: '', type: '', lv: null, cost: null, rarity: '', link: '', vanilla: false };

// ---------- Collection maths ----------
const sleeveOf = c => c.sleeved === true ? 'single' : (c.sleeved || ''); // '', 'single' or 'double'
const SLEEVE_LABEL = { '': 'Not sleeved', single: 'Single sleeved', double: 'Double sleeved' };
const keyOf = (num, collector, art = '') => num + (collector ? '+' + (art || '') : '');
function ownedByNum(num, incoming = S.settings.includeIncoming) {
  let n = 0; for (const c of Object.values(S.cards)) if (c.num === num) n += (c.owned || 0) + (incoming ? (c.incoming || 0) : 0); return n;
}
function playableByNum(num, incoming) { // collector versions are kept out of play
  let n = 0; for (const c of Object.values(S.cards)) if (c.num === num && !c.collector) n += (c.owned || 0) + (incoming ? (c.incoming || 0) : 0); return n;
}
const coreCount = core => core.cards.reduce((s, e) => s + e.qty, 0);
function coreColours(core) { return [...new Set(core.cards.map(e => info(e.num).colour).filter(Boolean))]; }
function needs(status) { const m = {}; for (const c of Object.values(S.cores)) if (!status || c.status === status) for (const e of c.cards) m[e.num] = (m[e.num] || 0) + e.qty; return m; }
function priceOf(num) { const c = Object.values(S.cards).find(x => x.num === num && x.price); return c ? c.price : null; }

const photoURLs = {};
async function photoURL(id) { if (!id) return null; if (photoURLs[id]) return photoURLs[id]; const b = await DB.get('photos', id); if (!b) return null; return photoURLs[id] = URL.createObjectURL(b); }
// Card pictures come from TCGplayer's image server. (Bandai's own site blocks its images from showing inside other sites.)
// A picture reference is a card number, or "number@productId" for a particular printing such as an alt art.
function officialURL(ref) { const [num, pid0] = String(ref).split('@'); const pid = pid0 || CATALOG[num]?.pid;
  return pid ? `https://tcgplayer-cdn.tcgplayer.com/product/${pid}_400w.jpg` : `https://www.gundam-gcg.com/en/images/cards/card/${encodeURIComponent(num)}.webp`; }
function backupURL(ref) { const num = String(ref).split('@')[0]; return `https://www.gundam-gcg.com/en/images/cards/card/${encodeURIComponent(num)}.webp`; }
async function hydrateImages(root) {
  for (const el of root.querySelectorAll('[data-photo],[data-official]')) {
    const id = el.dataset.photo; let src = id ? await photoURL(id) : null;
    if (!src && el.dataset.official && S.settings.officialImages) src = officialURL(el.dataset.official);
    if (!src) continue;
    if (el.querySelector('img')) continue;
    const img = new Image(); img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.style.visibility = 'hidden';
    el.prepend(img); // must be on the page for lazy loading to start
    img.onload = () => { el.querySelector('.ph')?.remove(); img.style.visibility = ''; };
    img.onerror = () => { const b = !id && backupURL(el.dataset.official); if (b && img.src !== b) img.src = b; };
    img.src = src;
  }
}

function darkTab(canvas) { // where's the dark strip the number is printed on? (fractions of the picture, or null)
  return (() => { const k = Math.min(1, 300 / canvas.width), t = document.createElement('canvas'); t.width = Math.round(canvas.width * k); t.height = Math.round(canvas.height * k);
      const x = t.getContext('2d', { willReadFrequently: true }); x.drawImage(canvas, 0, 0, t.width, t.height); const d = x.getImageData(0, 0, t.width, t.height).data;

      const rows = new Array(t.height).fill(0), cols = new Array(t.width).fill(0);

      // tallest band of mostly-dark rows (ignores thin dark edges of the photo)
      let best = [0, -1], run = -1; for (let y = 0; y <= t.height; y++) { const dark = y < t.height && rows[y] > t.width * 0.25 && rows[y] < t.width * 0.97;
        if (dark && run < 0) run = y; if (!dark && run >= 0) { if (y - run > best[1] - best[0]) best = [run, y]; run = -1; } }

      const filter = f === '' ? 'grayscale(1)' : f === 'c' ? 'grayscale(1) contrast(2.5) invert(1)' : 'grayscale(1) blur(1px) contrast(3) invert(1)';

  if (fl && n + fl[1] === 25) out.push(['ok', `${n} + ${fl[1]} flex: ${Object.entries(core.flex).map(([c, [num]]) => `${c} → ${info(num).name}`).join(', ')}`]);
  if (col.length > 2) out.push(['bad', 'More than 2 colours']);
  core.cards.forEach(e => { if (e.qty > 4) out.push(['bad', `${info(e.num).name}: more than 4`]); if (RULES.banned[e.num]) out.push(['bad', `${info(e.num).name} is banned`]); if (info(e.num).vanilla) out.push(['warn', `${info(e.num).name} is a plain 2/2 — pairs only with cores that have none`]); });
  const miss = core.cards.reduce((s, e) => s + Math.max(0, e.qty - playableByNum(e.num, true)), 0);
  if (miss) out.push(['warn', `${miss} cards to buy`]); else if (n) out.push(['ok', 'All cards owned']);
  // physical copies: the same card in several of your built cores at once
  if (core.status === 'built') for (const e of core.cards) { let tot = 0; for (const c of Object.values(S.cores)) if (c.status === 'built') { for (const x of c.cards) if (x.num === e.num) tot += x.qty; const f = c.flex && Object.values(c.flex).find(([num]) => num === e.num); if (f) tot += f[1]; }
    const own = playableByNum(e.num, true); if (tot > own) out.push(['warn', `${info(e.num).name}: ${tot} across your cores, you own ${own}`]); }
  return out;
}

  const cards = deckCards(d), errors = [], warns = [], n = cards.reduce((s, e) => s + e.qty, 0);
  if (d.a === d.b) errors.push('Both halves are the same core');
  const res = cards.filter(e => isResource(e.num)).reduce((s, e) => s + e.qty, 0);
  if (res) errors.push(`${res} resource card${res === 1 ? '' : 's'} in the main deck — resources go in the separate 10-card resource deck`);
  if (n !== 50) errors.push(`${n} cards — a deck must be exactly 50`);
  const cols = [...new Set(cards.map(e => info(e.num).colour).filter(Boolean))]; if (cols.length > 2) errors.push(`${cols.length} colours (${cols.join(', ')}) — max 2`);
  const unk = cards.filter(e => !info(e.num).colour).length; if (unk) warns.push(`${unk} cards have no colour saved`);
  for (const e of cards) {
    const i = info(e.num);
    if (e.qty > 4) errors.push(`${e.qty} × ${i.name} — max 4 per card number`);
    if (RULES.banned[e.num]) errors.push(`${i.name} is banned`);
    if (RULES.restricted[e.num] && e.qty > RULES.restricted[e.num]) errors.push(`${i.name} limited to ${RULES.restricted[e.num]}`);

  const has = Object.fromEntries(cards.map(e => [e.num, 1]));
  for (const [x, y] of RULES.bannedPairs) if (has[x] && has[y]) errors.push(`${info(x).name} can't be in a deck with ${info(y).name}`);

  const short = cards.reduce((s, e) => s + Math.max(0, e.qty - playableByNum(e.num, true)), 0);
  if (short) warns.push(`You're short ${short} card${short > 1 ? 's' : ''} to build both halves at once`);

}

/* =========================== SOLD PRICES FROM SCREENSHOTS =========================== */
const MONTHS = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
const EXCLUDE = /\b(LR\s?\+|R\s?\+|U\s?\+|C\s?\+|\+\+|SP|alt(ernate)?\s?art|japanese|\bJP\b|graded|PSA|BGS|CGC|parallel|proxy|custom|lot\s+of\s+\d{2,}|booster|sealed|box)\b/i;
function parseSold(text, targetNum) {
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean), out = [];
  let cur = null;
  const finish = () => { if (cur && cur.price != null) out.push(cur); cur = null; };
  for (const ln of lines) {
    const dm = ln.match(/sold\s+(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?\s*(\d{4})?/i);
    if (dm) { finish(); const y = dm[3] ? +dm[3] : new Date().getFullYear(); const mo = MONTHS[dm[2].toUpperCase()]; cur = { date: mo != null ? new Date(Date.UTC(y, mo, +dm[1])).toISOString().slice(0, 10) : null, title: '', price: null }; continue; }
    if (!cur) cur = { date: null, title: '', price: null };
    const pm = ln.match(/(?:AU\s*)?\$\s?(\d{1,4}(?:[.,]\d{2})?)/);
    const isPost = /postage|delivery|shipping|^\+|free\s/i.test(ln);
    if (pm && !isPost && cur.price == null) { cur.price = parseFloat(pm[1].replace(',', '.')); continue; }
    if (!pm && cur.price == null && !/^(pre-?owned|brand new|buy it now|or best offer|best offer accepted|sponsored|\d+ bids?)$/i.test(ln)) cur.title += (cur.title ? ' ' : '') + ln;
  }
  finish();
  return out.map(r => {
    const t = r.title, nums = (t.toUpperCase().match(/(GD|ST|EB)\d{2}-\d{3}/g) || []).map(normNum);
    let qty = 1; const q = t.match(/(?:\bx\s?([2-9])\b|\b([2-9])\s?x\b|playset)/i); if (q) qty = q[1] ? +q[1] : q[2] ? +q[2] : 4;
    let reason = '';
    if (EXCLUDE.test(t)) reason = 'collector / not a single';
    else if (targetNum && nums.length && !nums.includes(targetNum)) reason = 'different card';
    return { ...r, qty, each: Math.round(r.price / qty * 100) / 100, reason, include: !reason && r.price > 0 };
  });
}

// Searches current Buy It Now listings on eBay Australia by card number, skips collector / Japanese / graded / sealed listings,
// splits playsets into a price each, and saves the cheapest and a typical price for each card (postage not included).
const relayURL = () => (S.settings.ebayRelay || '').trim().replace(/\/+$/, '');
const setOf = num => { const s = (info(num).set || num.slice(0, 4)).replace(/[_-].*$/, ''); return /^ST/.test(s) ? `${s} starter deck` : /^PR|GCG-PR/.test(s) ? 'promo' : `${s} booster`; };
async function ebayPing() { const r = await fetch(relayURL() + '/ping'); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'No reply'); return true; }
async function ebayPrice(num) {
  const r = await fetch(`${relayURL()}/search?q=${encodeURIComponent(num)}&market=EBAY_AU`), j = await r.json();
  if (j.error) throw new Error(j.error);
  const want = num.replace('-', ''), rows = [];
  for (const it of j.items || []) {
    const t = it.title || '', flat = t.toUpperCase().replace(/[\s\-–_]/g, '');
    if (!flat.includes(want) || EXCLUDE.test(t) || /\b(LR|R|U|C)\s?\+|\bfoil\b|holo|parallel/i.test(t) || it.price == null) continue;
    const nums = (t.toUpperCase().match(/(GD|ST|EB)\s?\d{2}\s?-?\s?\d{3}/g) || []).map(normNum); if (new Set(nums).size > 1) continue; // lots of different cards
    let qty = 1; const q = t.match(/(?:\bx\s?([2-9])\b|\b([2-9])\s?x\b|playset)/i); if (q) qty = q[1] ? +q[1] : q[2] ? +q[2] : 4;
    rows.push({ ...it, qty, each: Math.round(it.price / qty * 100) / 100 });
  }
  rows.sort((a, b) => a.each - b.each);
  const v = rows.slice(0, 10).map(x => x.each), p = rows.length ? { low: v[0], typ: median(v), n: rows.length, cur: (rows[0].cur || 'AUD'), date: today(), top: rows.slice(0, 6) } : { low: null, n: 0, date: today(), top: [] };
  S.ebay = S.ebay || {}; S.ebay[num] = p; save(); return p;
}

  $('#lvCamBtn').style.display = cams.length > 1 ? '' : 'none';
  $('#lvZoomBtn').style.display = caps.zoom ? '' : 'none'; $('#lvZoomBtn').textContent = `Zoom ${LIVE.zoom || 1}×`;
  $('#lvLightBtn').style.display = caps.torch ? '' : 'none'; $('#lvLightBtn').textContent = 'Light off';

}
$('#lvCamBtn').onclick = async () => {
  const cams = await liveCameras(); if (cams.length < 2) return;
  const cur = LIVE.stream?.getVideoTracks()[0]?.getSettings().deviceId, i = cams.findIndex(c => c.deviceId === cur);
  S.settings.liveCam = cams[(i + 1) % cams.length].deviceId; save(); await liveOpenCamera();

};
$('#lvZoomBtn').onclick = async () => {
  const caps = LIVE.caps || {}; if (!caps.zoom) return;
  const steps = [1, 2, 2.5, 3, 4].filter(z => z <= caps.zoom.max), i = steps.indexOf(LIVE.zoom || 1);
  LIVE.zoom = steps[(i + 1) % steps.length]; S.settings.liveZoom = LIVE.zoom; save();
  await LIVE.stream?.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom: LIVE.zoom }] }).catch(() => {});
  $('#lvZoomBtn').textContent = `Zoom ${LIVE.zoom}×`;
};

  LIVE.torch = !LIVE.torch;
  await LIVE.stream?.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: LIVE.torch }] }).catch(() => {});

function stopLive() { LIVE.on = false; LIVE.stream?.getTracks().forEach(t => t.stop()); LIVE.stream = null; $('#live').classList.remove('on'); }
function liveSave() { try { localStorage.setItem('gtcg-live', JSON.stringify(LIVE.list)); } catch { } }
function liveCount() { const n = LIVE.list.reduce((s, e) => s + e.qty, 0); $('#lvCount').textContent = `${n} card${n === 1 ? '' : 's'}`; }
function liveGrab() { // the part of the picture inside the on-screen box, enlarged for reading
  const v = $('#lvVideo'); if (!v.videoWidth) return null;
  const b = $('#lvBox').getBoundingClientRect(), r = v.getBoundingClientRect();
  const sc = Math.max(r.width / v.videoWidth, r.height / v.videoHeight), ox = (r.width - v.videoWidth * sc) / 2, oy = (r.height - v.videoHeight * sc) / 2;
  const x = (b.left - r.left - ox) / sc, y = (b.top - r.top - oy) / sc, w = b.width / sc, h = b.height / sc;
  const c = document.createElement('canvas'), k = Math.min(3, 900 / w); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d'); ctx.filter = 'grayscale(1) contrast(1.8)'; ctx.drawImage(v, x, y, w, h, 0, 0, c.width, c.height); return c;
}
async function liveLoop() {
  let flip = 0;
  while (LIVE.on) {
    if (LIVE.pending || !LIVE.worker) { await new Promise(r => setTimeout(r, 150)); continue; }
    let c = liveGrab(); if (!c) { await new Promise(r => setTimeout(r, 150)); continue; }
    // take turns: the whole box, the dark strip the number sits on, and the middle of the box
    const mode = flip++ % 3, t = mode === 1 ? darkTab(c) : mode === 2 ? [.08, .12, .92, .88] : null;
    if (t) { const n = document.createElement('canvas'), w = (t[2] - t[0]) * c.width, h = (t[3] - t[1]) * c.height, k = Math.min(3, 900 / w);
      n.width = w * k; n.height = h * k; n.getContext('2d').drawImage(c, t[0] * c.width, t[1] * c.height, w, h, 0, 0, n.width, n.height); c = n; }
    let text = '';
    try { text = (await LIVE.worker.recognize(c)).data.text; } catch { }
    if (!LIVE.on || LIVE.pending) continue;
    const usable = text.replace(/[^A-Z0-9]/gi, '').length >= 4;
    const pick = usable ? pickCard([text], '', '') : { num: '' };
    const top = usable ? (window.lastPick || []) : [];
    // lock on when the same number reads cleanly twice in a row (or once, very cleanly)
    // lock on when the same number keeps coming up: twice if it's a clean read, three times if it's a close one
    let hit = '';
    const cand = top[0] && top[0][0] <= 1.3 ? top[0][1] : '';
    LIVE.recent.push(cand ? cand + (pick.sure ? '!' : '') : ''); LIVE.recent = LIVE.recent.slice(-4);
    if (cand) { const same = LIVE.recent.filter(n => n.replace('!', '') === cand), sure = same.filter(n => n.endsWith('!')).length;
      if (sure >= 2 || same.length >= 3 || top[0][0] <= 0.05) hit = cand; }
    const now = Date.now();
    if (cand && cand === LIVE.ignore && now < LIVE.ignoreUntil) LIVE.ignoreUntil = now + 1500; // same card still in view: don't add it twice
    if (hit && hit === LIVE.ignore && now < LIVE.ignoreUntil) { LIVE.ignoreUntil = now + 1500; $('#lvRead').textContent = `${hit} added — show the next card`; continue; }
    if (hit) { liveAsk(hit); continue; }
    $('#lvRead').textContent = cand ? `Reading… ${cand}?` : 'Looking for a number…';
    $('#lvBox').classList.remove('hit');
  }
}
function liveAsk(num) {
  LIVE.pending = num; LIVE.recent = []; navigator.vibrate?.(60); $('#lvBox').classList.add('hit'); $('#lvRead').textContent = `Found ${num}`;
  const i = info(num), have = ownedByNum(num, true), already = LIVE.list.find(e => e.num === num);
  const p = $('#lvPanel'); p.classList.add('on');
  p.innerHTML = `<div class="row" style="gap:10px;align-items:center">
      <div style="width:56px;flex:none"><div class="tile"><div class="img" data-official="${esc(num)}"><div class="ph">${esc(num)}</div></div></div></div>
      <div class="grow" style="min-width:0"><b>${esc(i.name || num)}</b><div class="small muted">${esc(num)}${have ? ` · you have ${have}` : ''}${already ? ` · ${already.qty} in this scan` : ''}</div></div>
      <button class="btn ghost sm" id="lvWrong">Wrong</button></div>
    <div class="small muted" style="margin-top:8px">How many?</div>
    <div class="qty">${[1, 2, 3, 4].map(n => `<button class="btn" data-lq="${n}">${n}</button>`).join('')}<button class="btn ghost" data-lq="more">5+</button></div>`;
  hydrateImages(p);
  p.querySelectorAll('[data-lq]').forEach(b => b.onclick = () => {
    let q = b.dataset.lq === 'more' ? parseInt(prompt('How many?', '5'), 10) : +b.dataset.lq; if (!q || q < 1) return;
    const e = LIVE.list.find(x => x.num === num); if (e) e.qty += q; else LIVE.list.push({ num, qty: q });
    liveSave(); liveCount(); liveNext(num, `Added ${q} × ${i.name || num}`);

}
function liveNext(num, msg) {

  LIVE.ignore = num; LIVE.ignoreUntil = Date.now() + 2500; LIVE.pending = null;
}
$('#lvClose').onclick = () => { stopLive(); if (LIVE.list.length) toast('Scan kept — open Live scan again to carry on', 3000); };
$('#lvDone').onclick = () => { stopLive(); liveReview(); };
function liveReview(openPick = -1) {
  const L = LIVE.list, n = L.reduce((s, e) => s + e.qty, 0);
  if (!L.length) return toast('Nothing scanned yet');
  const specOf = e => (e.special || []).reduce((s, x) => s + x.qty, 0);
  const printings = num => { const c = CATALOG[num]; const a = (c?.alts || []).map(([pid, lab]) => [String(pid), lab]); return a.length ? a : [['', 'Collector (+ / alt art)']]; };
  const labelOf = (num, art) => (printings(num).find(([p]) => p === art) || [, 'Special'])[1];
  const row = (e, k) => { const sp = specOf(e), normal = e.qty - sp;
    return `<div style="padding:10px 0;border-bottom:1px solid #2a2d38">
      <div class="row" style="gap:10px;align-items:center">
        <div style="width:46px;flex:none"><div class="tile"><div class="img" data-official="${esc(e.num)}"><div class="ph"></div></div></div></div>
        <div class="grow" style="min-width:0"><b class="small">${esc(info(e.num).name || e.num)}</b><div class="small muted">${esc(e.num)} · ${normal} normal${sp ? ` · ${sp} special` : ''}</div></div>
        <div class="stepper"><button data-lr="${k}:-1" aria-label="One fewer">−</button><span>${e.qty}</span><button data-lr="${k}:1" aria-label="One more">+</button></div></div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px;padding-left:56px">
        ${(e.special || []).map((x, j) => `<span class="pill" style="display:inline-flex;align-items:center;gap:6px">${esc(labelOf(e.num, x.art))} ×${x.qty}<button class="btn ghost sm" style="padding:2px 8px" data-ls="${k}:${j}:-1" aria-label="One fewer special">−</button><button class="btn ghost sm" style="padding:2px 8px" data-ls="${k}:${j}:1" aria-label="One more special">+</button></span>`).join('')}
        <button class="btn ghost sm" data-lsp="${k}">+ Special copy</button></div>
      ${openPick === k ? `<div style="padding:8px 0 0 56px"><div class="small muted">Which printing is the special one?</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px">
        ${printings(e.num).map(([pid, lab]) => `<button class="btn sm" data-lpk="${k}:${pid}">${esc(lab)}</button>`).join('')}</div></div>` : ''}
    </div>`; };
  openSheet(`<h3>${n} card${n === 1 ? '' : 's'} scanned</h3><p class="small muted">Check the counts. Got a C+, LR+ or alt art among them? Tap <b>+ Special copy</b> on that card.</p>
    <div id="lvList">${L.map(row).join('')}</div>
    <label class="f"><input type="checkbox" id="lvInc" style="width:20px;height:20px;vertical-align:middle;accent-color:var(--accent)"> These are on the way (not arrived yet)</label>
    <div class="row" style="gap:8px;margin-top:12px"><button class="btn grow" id="lvAdd">Add ${n} to collection</button><button class="btn ghost" id="lvMore">Scan more</button></div>
    <button class="btn ghost sm" id="lvClear" style="margin-top:10px">Clear this scan</button>`, root => {
    root.querySelectorAll('[data-lr]').forEach(b => b.onclick = () => { const [k, d] = b.dataset.lr.split(':').map(Number); const e = L[k];
      e.qty += d; if (e.qty < specOf(e)) { const last = e.special[e.special.length - 1]; last.qty--; if (!last.qty) e.special.pop(); } // fewer cards: take from the specials last
      if (e.qty <= 0) L.splice(k, 1); liveSave(); L.length ? liveReview() : closeSheet(); });
    root.querySelectorAll('[data-lsp]').forEach(b => b.onclick = () => liveReview(+b.dataset.lsp === openPick ? -1 : +b.dataset.lsp));
    root.querySelectorAll('[data-lpk]').forEach(b => b.onclick = () => { const [k, art] = b.dataset.lpk.split(':'); const e = L[+k]; e.special = e.special || [];
      if (e.qty - specOf(e) <= 0) e.qty++; // no normal copy left to turn special: it's an extra card

    root.querySelectorAll('[data-ls]').forEach(b => b.onclick = () => { const [k, j, d] = b.dataset.ls.split(':').map(Number); const e = L[k], x = e.special[j];
      if (d > 0) { if (e.qty - specOf(e) <= 0) e.qty++; x.qty++; } else { x.qty--; if (!x.qty) e.special.splice(j, 1); } // a special going back becomes a normal copy
      liveSave(); liveReview(); });
    $('#lvMore').onclick = () => { closeSheet(); startLive(); };
    $('#lvClear').onclick = () => { if (!confirm('Throw away this scan list?')) return; LIVE.list = []; liveSave(); closeSheet(); };
    $('#lvAdd').onclick = () => { const inc = $('#lvInc').checked;
      const put = (num, collector, art, q, rar) => { if (q <= 0) return; const key = keyOf(num, collector, art);
        const c = S.cards[key] || (S.cards[key] = { num, collector, art: art || '', owned: 0, incoming: 0, rarity: rar || info(num).rarity || '', sleeved: '', notes: '' });

  });
}
